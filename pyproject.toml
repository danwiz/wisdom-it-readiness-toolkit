[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wisdom-it-readiness-toolkit"
version = "0.2.0.dev0"
description = "A governed toolkit for practical technology readiness assessment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Dane Wisdom"}]
keywords = ["it-readiness", "technology-assessment", "cybersecurity", "governance"]

[project.scripts]
witrt = "cli:main"

[tool.setuptools]
py-modules = ["cli", "report", "scorer"]
packages = ["wisdom_it_readiness_data"]
package-dir = {"" = "src", "wisdom_it_readiness_data" = "assessments"}

[tool.setuptools.package-data]
wisdom_it_readiness_data = ["*.json"]
